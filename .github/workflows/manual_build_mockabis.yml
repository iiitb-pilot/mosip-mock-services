name: Manual build for mock-abis 

on: workflow_dispatch
  
jobs:
  build:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v1
      with:
        ref: ${{ github.ref }}
        java-version: 11
        server-id: ossrh
        settings-path: ${{ github.workspace }}

    - name: Setup branch and GPG public key 
      run: |
        echo "BRANCH_NAME=$(echo ${{ github.ref }} | sed -e 's,.*/\(.*\),\1,')" >> $GITHUB_ENV
        echo ${{ env.BRANCH_NAME }}
        
    - uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-${{ env.BRANCH_NAME }}
    
    - name: Install xmllint
      run: |
        sudo apt-get update
        sudo apt-get install libxml2-utils
        
    - name: Build abis with Maven
      run: |
        cd mock-abis
        mvn -B package -s $GITHUB_WORKSPACE/settings.xml --file pom.xml
    
    - name: Build image
      run: |
          cd mock-abis
          ls -ltr ./target
          docker build . --file Dockerfile --tag mock-abis
          
    - name: Log into registry
      run: echo "${{ secrets.release_docker_hub }}" | docker login -u ${{ secrets.actor_docker_hub }} --password-stdin

    - name: Push image
      run: |
          IMAGE_ID=${{ secrets.dev_namespace_docker_hub }}/mock-abis
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=$BRANCH_NAME
          echo IMAGE_ID=$IMAGE_ID
          echo VERSION=$VERSION
          docker tag mock-abis $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION
